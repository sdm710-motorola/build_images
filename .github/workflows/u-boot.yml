name: U-Boot Docker Image

on:
  push:
    branches: ["main"]

jobs:
  build:
    environment: main
    name: Build U-Boot Docker Image
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v7
      - name: Login in GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER   }}
          password: ${{ secrets.GHCR_SECRET }}
      - name: Metadata extraction for docker
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw, value=u-boot
          labels: |
            org.opencontainers.image.title=U-Boot
      - name: Build docker image
        uses: docker/build-push-action@v7
        with:
          context: ./u-boot
          push: true
          file: ./u-boot/Dockerfile
          labels: ${{ steps.metadata.outputs.labels }}
          tags: ${{ steps.metadata.outputs.tags }}